# SPDX-License-Identifier: Apache-2.0
# The verification table in CONTRIBUTING.md, run on every push and pull request (SPEC §12).
#
# Job boundaries follow failure MODES, not convenience, so a red check tells you
# what kind of thing broke before you open it: `build` means the code is wrong,
# `rules` means the security boundary moved, `guards` means something about the
# project's shape is wrong — a leaked secret, a missing header, a sample that
# stopped demonstrating what it is for, a dependency with the wrong licence.
#
# Every job is credential-free. Nothing here can reach a real backend:
# `demo-bikeshed` is an emulator-only project id.
#
# A push to main or develop runs this through deploy.yml, which calls it and
# deploys only once all three jobs pass. That is why there is no `push` trigger
# here: one would run the same checks twice for every push.

name: ci

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reproducible installs. `npm ci` fails outright if a lockfile is stale, which
  # is the behaviour we want from CI and not from a developer machine.
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  build:
    name: typecheck, build, test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json

      # `npm ci` rather than `npm install`: it fails outright on a stale
      # lockfile, which is what CI is for. `cli/` is absent on purpose — it has
      # zero dependencies, so there is nothing to install and no lockfile to
      # commit.
      - name: Install
        run: |
          npm ci
          npm --prefix app ci
          npm --prefix functions ci

      # Runs FIRST. Every generated artifact is committed, so a change to the
      # identity policy that was not re-rendered has to fail before anything
      # else runs — otherwise the tests pass against rules nobody deployed.
      - name: Generated artifacts are up to date
        run: |
          npm run check:policy
          npm run check:agents
          git diff --exit-code

      - name: Typecheck the app
        run: npm --prefix app run typecheck

      - name: Build
        run: npm run build

      # The build writes app/dist, which is gitignored — but a build that
      # dirties a TRACKED file is how a deployment binding would enter the
      # tree, and check-secrets matches by shape, so a custom domain would not
      # be caught. Cheap, and it covers every future build step too.
      - name: The build changed no tracked file
        run: git diff --exit-code

      - name: Tools tests
        run: npm run test:tools

      # The unit tests prove the substitution; only a real build proves the
      # plugin is registered, that `apply: "build"` lets it run, and that it
      # runs AFTER Vite copies app/public into app/dist. The Build step above
      # is the unconfigured path — this is the configured one.
      - name: The served agent instructions carry this build's origin
        run: |
          BIKESHED_PUBLIC_ORIGIN=https://stamp.example npm --prefix app run build
          grep -q 'POST https://stamp.example/mcp' app/dist/llms.txt
          grep -q 'export BIKESHED_ORIGIN=https://stamp.example' app/dist/skills/bikeshed-publishing/SKILL.md
          # The download for Claude's skill upload, packed from the stamped copy.
          unzip -p app/dist/skills/bikeshed-publishing.zip bikeshed-publishing/SKILL.md | grep -q 'export BIKESHED_ORIGIN=https://stamp.example'
          # Not `! grep`: bash's -e ignores a negated command, so written that
          # way this line could never fail the step.
          if grep -rqF '<deployment>' app/dist; then
            echo "app/dist still names <deployment>"
            exit 1
          fi
          git diff --exit-code

      - name: Functions tests
        run: npm --prefix functions test

      - name: App tests and coverage
        run: npm --prefix app run coverage

      - name: CLI tests
        run: npm --prefix cli test

      # The dry runs are the assertion that firebase-admin is initialized
      # lazily. If an import ever moves to module scope this fails here, rather
      # than the day an operator tries to preview a teardown without gcloud.
      - name: Operator scripts run without credentials
        run: |
          node scripts/setup.mjs --account you@example.com --project demo-bikeshed --dry-run
          BIKESHED_PUBLIC_ORIGIN=https://example.com node scripts/setup.mjs --account you@example.com --project demo-bikeshed --media-bucket demo-bikeshed-media --dry-run
          node scripts/teardown.mjs --yes --account you@example.com --project demo-bikeshed --dry-run
          node scripts/publish.mjs --doc bikeshed-tour --project demo-bikeshed --dry-run
          node scripts/publish.mjs --doc markdown-reference --project demo-bikeshed --dry-run
          node scripts/set-access.mjs --doc bikeshed-tour --add a@example.com --project demo-bikeshed --dry-run
          node scripts/media.mjs setup --media-bucket demo-bikeshed-media --origin https://example.com --project demo-bikeshed --dry-run
          MEDIA_FIXTURE=$(mktemp -d)
          trap 'rm -rf "$MEDIA_FIXTURE"' EXIT
          for name in bikeshed-explainer.mp4 bikeshed-explainer.vtt poster.webp; do
            printf 'dry-run fixture\n' > "$MEDIA_FIXTURE/$name"
          done
          node scripts/media.mjs publish --directory "$MEDIA_FIXTURE" --revision v1 --media-bucket demo-bikeshed-media --project demo-bikeshed --dry-run

  rules:
    name: security rules
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # The emulators are a Java process, not a Node one.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Install the Firebase CLI
        run: npm install --no-save firebase-tools

      - name: Rules tests against the emulators
        run: npx firebase emulators:exec --only firestore,database --project demo-bikeshed "npm run test:rules"

  guards:
    name: secrets, headers, content, licences
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The secrets guard scans git HISTORY for attribution trailers, so a
          # shallow clone would silently check nothing.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix app ci
          npm --prefix functions ci

      - name: Secrets and deployment bindings
        run: npm run check:secrets

      - name: SPDX headers
        run: npm run check:headers

      - name: Samples still demonstrate what they are for
        run: npm run check:content

      - name: Dependency licences
        run: npm run check:licenses
