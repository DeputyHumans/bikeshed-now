# SPDX-License-Identifier: Apache-2.0
# The verification table in CONTRIBUTING.md, run on every push and pull request (SPEC §12).
#
# Job boundaries follow failure MODES, not convenience, so a red check tells you
# what kind of thing broke before you open it: `build` means the code is wrong,
# `rules` means the security boundary moved, `guards` means something about the
# project's shape is wrong — a leaked secret, a missing header, a sample that
# stopped demonstrating what it is for, a dependency with the wrong licence.
#
# Every job is credential-free. Nothing here can reach a real backend:
# `demo-bikeshed` is an emulator-only project id.
#
# The build and rules jobs each end by writing a summary on the run's page
# (tools/ci-summary.mjs). It reports and never gates, so nothing below that point
# can fail a job. A step that runs a command needs an `id`, and
# tools/ci-summary.test.mjs fails until the summary knows it.
#
# A push to main or develop runs this through deploy.yml, which calls it and
# deploys only once all three jobs pass. That is why there is no `push` trigger
# here: one would run the same checks twice for every push.

name: ci

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reproducible installs. `npm ci` fails outright if a lockfile is stale, which
  # is the behaviour we want from CI and not from a developer machine.
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_AUDIT: "false"

jobs:
  build:
    name: typecheck, build, test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json

      # `npm ci` rather than `npm install`: it fails outright on a stale
      # lockfile, which is what CI is for. `cli/` is absent on purpose — it has
      # zero dependencies, so there is nothing to install and no lockfile to
      # commit.
      - name: Install
        id: install
        run: |
          npm ci
          npm --prefix app ci
          npm --prefix functions ci

      # Runs FIRST. Every generated artifact is committed, so a change to the
      # identity policy that was not re-rendered has to fail before anything
      # else runs — otherwise the tests pass against rules nobody deployed.
      - name: Generated artifacts are up to date
        id: generated
        run: |
          npm run check:policy
          npm run check:agents
          git diff --exit-code

      - name: Typecheck the app
        id: typecheck
        run: npm --prefix app run typecheck

      - name: Build
        id: build
        run: npm run build

      # The build writes app/dist, which is gitignored — but a build that
      # dirties a TRACKED file is how a deployment binding would enter the
      # tree, and check-secrets matches by shape, so a custom domain would not
      # be caught. Cheap, and it covers every future build step too.
      - name: The build changed no tracked file
        id: clean-build
        run: git diff --exit-code

      - name: Tools tests
        id: tools-tests
        env:
          BIKESHED_NODE_TEST_FLAGS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/tools/ci-test-reporter.mjs
            --test-reporter-destination=${{ runner.temp }}/ci-report-tools.jsonl
        run: npm run test:tools

      # The unit tests prove the substitution; only a real build proves the
      # plugin is registered, that `apply: "build"` lets it run, and that it
      # runs AFTER Vite copies app/public into app/dist. The Build step above
      # is the unconfigured path — this is the configured one.
      - name: The served agent instructions carry this build's origin
        id: stamped-build
        run: |
          # The Build step's output, unconfigured: a deployment with no custom
          # domain serves the placeholder on purpose, never the repo's address.
          grep -q 'export BIKESHED_ORIGIN=https://<deployment>' app/dist/skills/bs-publish/SKILL.md
          BIKESHED_PUBLIC_ORIGIN=https://stamp.example npm --prefix app run build
          grep -q 'POST https://stamp.example/mcp' app/dist/llms.txt
          grep -q 'export BIKESHED_ORIGIN=https://stamp.example' app/dist/skills/bs-publish/SKILL.md
          # The download for Claude's skill upload, packed from the stamped copy.
          unzip -p app/dist/skills/bs-publish.zip bs-publish/SKILL.md | grep -q 'export BIKESHED_ORIGIN=https://stamp.example'
          unzip -p app/dist/skills/bikeshed-plugin.zip skills/bs-publish/SKILL.md | grep -q 'export BIKESHED_ORIGIN=https://stamp.example'
          # Not `! grep`: bash's -e ignores a negated command, so written that
          # way this line could never fail the step.
          if grep -rqF '<deployment>' app/dist; then
            echo "app/dist still names <deployment>"
            exit 1
          fi
          # Zips are stored, so this sees inside them too.
          if grep -rqF 'bikeshed.now' app/dist/skills; then
            echo "app/dist/skills names the hosted address on another deployment"
            exit 1
          fi
          git diff --exit-code

      # Both include patterns are needed, and either alone measures nothing:
      # node:test filters the compiled file, then the source it maps back to.
      - name: Functions tests
        id: functions-tests
        env:
          BIKESHED_NODE_TEST_FLAGS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/tools/ci-test-reporter.mjs
            --test-reporter-destination=${{ runner.temp }}/ci-report-functions.jsonl
            --experimental-test-coverage --enable-source-maps
            --test-coverage-include=lib/** --test-coverage-include=src/**
        run: npm --prefix functions test

      - name: App tests and coverage
        id: app-tests
        env:
          BIKESHED_CI_REPORT_DIR: ${{ runner.temp }}
        run: npm --prefix app run coverage

      - name: CLI tests
        id: cli-tests
        env:
          BIKESHED_NODE_TEST_FLAGS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/tools/ci-test-reporter.mjs
            --test-reporter-destination=${{ runner.temp }}/ci-report-cli.jsonl
            --experimental-test-coverage --test-coverage-include=src/**
        run: npm run test:cli

      # The dry runs are the assertion that firebase-admin is initialized
      # lazily. If an import ever moves to module scope this fails here, rather
      # than the day an operator tries to preview a teardown without gcloud.
      - name: Operator scripts run without credentials
        id: dry-runs
        run: |
          node scripts/setup.mjs --account you@example.com --project demo-bikeshed --dry-run
          BIKESHED_PUBLIC_ORIGIN=https://example.com node scripts/setup.mjs --account you@example.com --project demo-bikeshed --media-bucket demo-bikeshed-media --dry-run
          node scripts/teardown.mjs --yes --account you@example.com --project demo-bikeshed --dry-run
          node scripts/publish.mjs --doc bikeshed-tour --project demo-bikeshed --dry-run
          node scripts/publish.mjs --doc markdown-reference --project demo-bikeshed --dry-run
          node scripts/set-access.mjs --doc bikeshed-tour --add a@example.com --project demo-bikeshed --dry-run
          node scripts/media.mjs setup --media-bucket demo-bikeshed-media --origin https://example.com --project demo-bikeshed --dry-run
          MEDIA_FIXTURE=$(mktemp -d)
          trap 'rm -rf "$MEDIA_FIXTURE"' EXIT
          for name in bikeshed-explainer.mp4 bikeshed-explainer.vtt poster.webp; do
            printf 'dry-run fixture\n' > "$MEDIA_FIXTURE/$name"
          done
          node scripts/media.mjs publish --directory "$MEDIA_FIXTURE" --revision v1 --media-bucket demo-bikeshed-media --project demo-bikeshed --dry-run

      # Everything below reports. None of it can fail the job, so a broken
      # report never holds back a deploy. The baseline is a cache entry rather
      # than an artifact because reading one needs no permission beyond
      # `contents: read`, and it is saved only from a green run on main, so
      # neither a red run nor a fork's pull request can become what later runs
      # compare with.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: coverage-artifact
        if: ${{ !cancelled() && steps.app-tests.outcome != 'skipped' }}
        continue-on-error: true
        with:
          name: app-coverage
          path: app/coverage
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/ci-baseline
          key: ci-summary-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-summary-build-

      - name: Job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          BIKESHED_CI_REPORT_DIR: ${{ runner.temp }}
          BIKESHED_CI_BASELINE: ${{ runner.temp }}/ci-baseline/snapshot.json
          BIKESHED_CI_STEPS: ${{ toJSON(steps) }}
          BIKESHED_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BIKESHED_CI_COVERAGE_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
        run: node tools/ci-summary.mjs --job build

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/ci-baseline
          key: ci-summary-build-${{ github.run_id }}-${{ github.run_attempt }}

  rules:
    name: security rules
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # The emulators are a Java process, not a Node one.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        id: install
        run: npm ci

      # The version deploy.yml deploys with, so a CLI release that changes the
      # emulators arrives as a reviewed diff here too.
      - name: Install the Firebase CLI
        id: firebase-cli
        run: npm install --no-save firebase-tools@15.25.1

      - name: Rules tests against the emulators
        id: rules-tests
        env:
          BIKESHED_NODE_TEST_FLAGS: >-
            --test-reporter=spec --test-reporter-destination=stdout
            --test-reporter=${{ github.workspace }}/tools/ci-test-reporter.mjs
            --test-reporter-destination=${{ runner.temp }}/ci-report-rules.jsonl
        run: npx firebase emulators:exec --only firestore,database --project demo-bikeshed "npm run test:rules"

      # Reporting only, as at the end of the build job.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/ci-baseline
          key: ci-summary-rules-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-summary-rules-

      - name: Job summary
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          BIKESHED_CI_REPORT_DIR: ${{ runner.temp }}
          BIKESHED_CI_BASELINE: ${{ runner.temp }}/ci-baseline/snapshot.json
          BIKESHED_CI_STEPS: ${{ toJSON(steps) }}
          BIKESHED_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci-summary.mjs --job rules

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/ci-baseline
          key: ci-summary-rules-${{ github.run_id }}-${{ github.run_attempt }}

  guards:
    name: secrets, headers, content, licences
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The secrets guard scans git HISTORY for attribution trailers, so a
          # shallow clone would silently check nothing.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            functions/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix app ci
          npm --prefix functions ci

      - name: Secrets and deployment bindings
        run: npm run check:secrets

      - name: SPDX headers
        run: npm run check:headers

      - name: Samples still demonstrate what they are for
        run: npm run check:content

      - name: Dependency licences
        run: npm run check:licenses
