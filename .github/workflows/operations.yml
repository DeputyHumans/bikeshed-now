# SPDX-License-Identifier: Apache-2.0
# Hourly metadata and public-health audit with log-write-only output (SPEC §12).
name: operations
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operations
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.PRODUCTION_WIF_PROVIDER }}
          service_account: ${{ secrets.PRODUCTION_OPS_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      # The audit can name the health function's direct Cloud Run host in a
      # finding, and this repository's run logs are public (deploy.yml says why
      # the suffix is enough).
      - name: Mask this project's function hosts
        env:
          PROJECT: ${{ secrets.PRODUCTION_FIREBASE_PROJECT }}
        run: |
          uri=$(gcloud functions describe health --gen2 --region us-central1 --project "$PROJECT" --format='value(serviceConfig.uri)' 2>/dev/null || true)
          suffix="${uri#https://health}"
          if [ -n "$uri" ] && [ "$suffix" != "$uri" ]; then
            echo "::add-mask::$suffix"
          else
            echo "::warning::could not read the function host suffix, so this run's log may name direct function hosts"
          fi
      - name: Audit without changing production
        env:
          PROJECT: ${{ secrets.PRODUCTION_FIREBASE_PROJECT }}
          ORIGIN: ${{ secrets.PRODUCTION_PUBLIC_ORIGIN }}
          INCIDENT_EMAIL: ${{ secrets.PRODUCTION_INCIDENT_EMAIL }}
        run: node scripts/ops.mjs audit --project "$PROJECT" --origin "$ORIGIN" --email "$INCIDENT_EMAIL" --monitoring --output /tmp/bikeshed-ops/audit.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: operations-audit
          path: /tmp/bikeshed-ops/*.json
          retention-days: 30
