    <path d="M4 14 16 4l12 10" stroke-width="3"/>
    <path d="M6.5 15v13M25.5 15v13" stroke-width="3"/>
    <path d="M11 18.5h10M11 26.5h10M11 22.5h7" stroke-width="2.4"/>
  </g>
</svg>
